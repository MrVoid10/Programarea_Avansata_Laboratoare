<div id="camere-container">
  <div *ngFor="let camera of camere" class="camera-card">
    
    <!-- Container imagine -->
    <div class="camera-img-container">
      <img [src]="camera.imagine" [alt]="camera.nume" class="camera-img" (click)="goToCamera(camera.id)">
    </div>

    <div class="camera-info">
      <span class="camera-nume">{{ camera.nume }}</span>
      <span class="camera-pret">{{ camera.pret }} {{ camera.moneda }}</span>
    </div>

    <button class="btn afla-mai-multe" (click)="goToCamera(camera.id)">Află mai multe</button>
  </div>
</div>
